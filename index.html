<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recetario de la abuela</title>
<meta name="description" content="Las recetas de la abuela, guardadas para siempre: cocina de siempre, paso a paso.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400&family=Caveat:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%232e4f9e'/><circle cx='50' cy='50' r='16' fill='%23e8b83a'/></svg>">
</head>
<body>

<div class="azulejo" aria-hidden="true"></div>
<button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu" data-menu="abre"><svg viewBox="0 0 20 14" aria-hidden="true"><path d="M1 2h18M1 7h18M1 12h18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Menú</button>
<nav class="menu" id="menu" hidden aria-label="Menú">
  <button type="button" data-menu="recetas">Recetas</button>
  <button type="button" data-menu="favs">♥ Mis favoritos</button>
  <button type="button" data-menu="compra">La compra</button>
  <button type="button" data-menu="mapa">El mapa</button>
  <button type="button" data-menu="pasaporte">Mi pasaporte</button>
</nav>

<header class="hero">
  <p class="kicker">Cocina de siempre, paso a paso</p>
  <h1>Recetario<br><em>de la abuela</em></h1>
  <p class="lema">Los platos de cada rincón de España con los gestos que no salen
  en las recetas: chafar, chascar, asustar, menear y esperar.</p>
  <p class="stats" id="stats"></p>
</header>

<main class="pagina" id="vista-indice"></main>
<main class="pagina" id="vista-receta" hidden></main>

<div class="cocina" id="cocina" hidden role="dialog" aria-modal="true" aria-label="Modo cocina"></div>
<div class="cocina-nav" id="cocina-nav" hidden><div class="cocina-nav-in"><button type="button" id="c-ant">Anterior</button><button type="button" class="sig" id="c-sig">Siguiente</button></div></div>

<div class="dock" id="dock" hidden>
  <div class="dock-in">
    <button class="dock-ir" id="dock-ir" type="button" aria-label="Ir al paso"><span class="dock-paso" id="dock-paso"></span><span class="dock-nombre" id="dock-nombre"></span></button>
    <span class="dock-tiempo" id="dock-tiempo"></span>
    <button class="dock-accion" id="dock-accion" type="button">Pausar</button>
  </div>
</div>
<button type="button" class="arriba" id="arriba" hidden aria-label="Volver arriba"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<p class="sr-only" aria-live="assertive" id="aviso-vivo"></p>

<footer>
  <div class="azulejo fin" aria-hidden="true"></div>
  <p>Guardado con mimo para que no se pierda ni una receta.</p>
</footer>

<script src="js/mapa.js"></script>
<script src="js/mundo.js"></script>
<script src="js/escenas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
